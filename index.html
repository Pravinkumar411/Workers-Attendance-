<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workers Attendance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: 50px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .contractor {
      background: #1976d2;
      color: white;
    }

    .worker {
      background: #2e7d32;
      color: white;
    }

    .login-box {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .login-btn {
      background: #333;
      color: white;
    }

    .back-btn {
      background: #ddd;
      color: #222;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Workers Attendance</h1>

    <p>Worker Attendance और Payment Management</p>

    <button class="contractor" onclick="showLogin('contractor')">
      Contractor Login
    </button>

    <button class="worker" onclick="showLogin('worker')">
      Worker Login
    </button>


    <div id="contractorLogin" class="login-box">

      <h2>Contractor Login</h2>

      <input type="text" id="contractorUser" placeholder="Contractor Username">

      <input type="password" id="contractorPass" placeholder="Password">

      <button class="login-btn" onclick="login('contractor')">
        Login
      </button>

      <button class="back-btn" onclick="goBack()">
        Back
      </button>

    </div>


    <div id="workerLogin" class="login-box">

      <h2>Worker Login</h2>

      <input type="text" id="workerUser" placeholder="Worker Username">

      <input type="password" id="workerPass" placeholder="Password">

      <button class="login-btn" onclick="login('worker')">
        Login
      </button>

      <button class="back-btn" onclick="goBack()">
        Back
      </button>

    </div>

    <div id="message"></div>

  </div>


  <script>

    function showLogin(type) {

      document.getElementById("contractorLogin").style.display = "none";
      document.getElementById("workerLogin").style.display = "none";

      document.getElementById("message").innerHTML = "";

      if (type === "contractor") {
        document.getElementById("contractorLogin").style.display = "block";
      }

      if (type === "worker") {
        document.getElementById("workerLogin").style.display = "block";
      }
    }


    function goBack() {

      document.getElementById("contractorLogin").style.display = "none";
      document.getElementById("workerLogin").style.display = "none";

      document.getElementById("message").innerHTML = "";
    }


    function login(type) {

      let username;
      let password;

      if (type === "contractor") {
        username = document.getElementById("contractorUser").value;
        password = document.getElementById("contractorPass").value;
      }

      if (type === "worker") {
        username = document.getElementById("workerUser").value;
        password = document.getElementById("workerPass").value;
      }

      if (username === "" || password === "") {

        document.getElementById("message").innerHTML =
          "⚠️ Username और Password दोनों भरें।";

        return;
      }

      if (type === "contractor") {

        document.getElementById("message").innerHTML =
          "✅ Contractor Login Successful!";

      } else {

        document.getElementById("message").innerHTML =
          "✅ Worker Login Successful!";

      }
    }

  </script>

</body>
</html>
