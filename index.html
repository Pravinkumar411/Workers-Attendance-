<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workers Attendance</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px #ccc;
}

h1,h2{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
}

button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.contractor{
    background:#1976d2;
    color:white;
}

.worker{
    background:#2e7d32;
    color:white;
}

.dark{
    background:#333;
    color:white;
}

.red{
    background:#d32f2f;
    color:white;
}

.green{
    background:#2e7d32;
    color:white;
}

.card{
    background:#f8f9fa;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

.login-box,
.dashboard{
    display:none;
}

.message{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
}

.summary{
    background:#e3f2fd;
    padding:15px;
    border-radius:10px;
    margin:10px 0;
}

.worker-card{
    background:#f8f9fa;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

.present{
    background:#2e7d32;
    color:white;
}

.absent{
    background:#d32f2f;
    color:white;
}

.small{
    font-size:14px;
    color:#555;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
    font-size:14px;
}

th{
    background:#eeeeee;
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:18px 0;
}

.success{
    color:#2e7d32;
}

.danger{
    color:#d32f2f;
}
</style>
</head>

<body>

<div class="container">

<h1>Workers Attendance</h1>

<p class="subtitle">
Worker Attendance और Payment Management
</p>


<!-- HOME -->

<div id="home">

    <button
        class="contractor"
        onclick="showLogin('contractor')"
    >
        Contractor Login
    </button>

    <button
        class="worker"
        onclick="showLogin('worker')"
    >
        Worker Login
    </button>

</div>


<!-- CONTRACTOR LOGIN -->

<div id="contractorLogin" class="login-box">

    <h2>👷 Contractor Login</h2>

    <input
        id="contractorUser"
        type="text"
        placeholder="Username"
    >

    <input
        id="contractorPass"
        type="password"
        placeholder="Password"
    >

    <button
        class="contractor"
        onclick="contractorLogin()"
    >
        Login
    </button>

    <button
        class="dark"
        onclick="goHome()"
    >
        Back
    </button>

</div>


<!-- WORKER LOGIN -->

<div id="workerLogin" class="login-box">

    <h2>Worker Login</h2>

    <input
        id="workerUser"
        type="text"
        placeholder="Worker Name या Mobile"
    >

    <input
        id="workerPass"
        type="password"
        placeholder="Password"
    >

    <button
        class="worker"
        onclick="workerLogin()"
    >
        Login
    </button>

    <button
        class="dark"
        onclick="goHome()"
    >
        Back
    </button>

</div>


<div id="message" class="message"></div>


<!-- CONTRACTOR DASHBOARD -->

<div id="contractorDashboard" class="dashboard">

    <h2>👷 Contractor Dashboard</h2>

    <div class="summary">

        <b>आज की तारीख:</b>
        <span id="today"></span>

        <hr>

        <b>Total Workers:</b>
        <span id="totalWorkers">0</span>

        <br><br>

        <b>आज Present:</b>
        <span id="todayPresent
